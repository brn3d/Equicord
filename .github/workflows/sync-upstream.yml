
name: Sync Fork

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Equicord/Equicord.git
          git fetch upstream main

      - name: Preserve fork autofix workflow
        run: |
          mkdir -p /tmp/fork-workflows
          cp .github/workflows/autofix.yml /tmp/fork-workflows/autofix.yml

      - name: Merge upstream
        run: |
          git merge upstream/main --no-edit -X ours

      - name: Restore fork autofix workflow
        run: |
          cp /tmp/fork-workflows/autofix.yml .github/workflows/autofix.yml
          git add .github/workflows/autofix.yml
          if ! git diff --cached --quiet; then
            git commit -m "Preserve fork autofix workflow"
          fi

      - name: Push changes
        run: |
          git push origin main
