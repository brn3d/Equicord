
name: Sync Fork

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Equicord/Equicord.git
          git fetch upstream main

      - name: Sync upstream files, excluding workflows
        run: |
          git merge upstream/main --no-commit --no-ff -X ours || true

          # Restore the fork's existing workflow directory
          git restore --source=HEAD --staged --worktree -- .github/workflows/

          # If there are no changes, don't create an empty commit
          if git diff --cached --quiet && git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi

          git add -A
          git commit -m "Sync with Equicord upstream"

      - name: Push changes
        run: |
          git push origin HEAD:main
